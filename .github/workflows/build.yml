name: Build KernelSU for Red Magic 6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          set-safe-directory: '*'

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzops pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Clang Compiler
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r418222b.tar.gz
          tar -xf clang-r418222b.tar.gz

      - name: Integrate KernelSU
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory '*'
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main || true
          
          if [ -f "arch/arm64/configs/lahaina_defconfig" ]; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/lahaina_defconfig
          elif [ -f "msm-5.4/arch/arm64/configs/lahaina_defconfig" ]; then
            echo "CONFIG_KSU=y" >> msm-5.4/arch/arm64/configs/lahaina_defconfig
          fi

      - name: Build Kernel
        run: |
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          make O=out lahaina_defconfig
          make -j$(nproc) O=out

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_with_KernelSU
          path: |
            out/arch/arm64/boot/Image
            msm-5.4/out/arch/arm64/boot/Image
