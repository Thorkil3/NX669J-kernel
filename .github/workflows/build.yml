name: Build KernelSU for Red Magic 6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Source Code Directly (Skip Git)
        run: |
          cd $GITHUB_WORKSPACE
          curl -L -o kernel.zip https://github.com/ztemt/NX669J-kernel/archive/refs/heads/main.zip
          unzip -q kernel.zip
          
          if [ -d "NX669J-kernel-main" ]; then
            mv NX669J-kernel-main/* . || true
            rm -rf NX669J-kernel-main
          fi
          rm -f kernel.zip

      - name: Setup Build Environment & Install LLVM Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lld llvm

      - name: Fetch Official Clang Toolchain via Git
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang-prebuilt
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang-prebuilt
          if [ -d "clang-r418222b" ]; then
            mv clang-r418222b/* $GITHUB_WORKSPACE/clang/
          elif [ -d "clang-stable" ]; then
            mv clang-stable/* $GITHUB_WORKSPACE/clang/
          fi
          rm -rf $GITHUB_WORKSPACE/clang-prebuilt

      - name: Integrate KernelSU Manually
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_DIR="."
          if [ -d "msm-5.4" ]; then TARGET_DIR="msm-5.4"; fi
          cd $TARGET_DIR
          
          mkdir -p drivers/kernelsu
          curl -L https://github.com/tiann/KernelSU/archive/refs/heads/main.zip -o ksu.zip
          unzip -q ksu.zip
          
          if [ -d "KernelSU-main" ]; then
            mv KernelSU-main/* drivers/kernelsu/ || true
            rm -rf KernelSU-main
          fi
          rm -f ksu.zip

          if [ -f "drivers/Makefile" ]; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Fix Source Code & Force Inject Configurations
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          
          # 1. تنظيف ملف الـ Kconfig الخاص بالإضاءة لمنع تحذيرات الترميز الصيني
          if [ -f "drivers/leds/nubia_led/aw8695/Kconfig" ]; then
            tr -cd '\11\12\15\40-\176' < drivers/leds/nubia_led/aw8695/Kconfig > drivers/leds/nubia_led/aw8695/Kconfig.clean
            mv drivers/leds/nubia_led/aw8695/Kconfig.clean drivers/leds/nubia_led/aw8695/Kconfig
          fi

          # 2. إنشاء مجلد المخرجات مسبقاً وتجهيز ملف التكوين مباشرة لحل معضلة "not found"
          mkdir -p out
          
          # البحث عن ملف التعديلات الأساسي لنوبيا وضخه مباشرة كـ .config بداخل مجلد out
          if [ -f "arch/arm64/configs/vendor/lahaina-qgki-perf_defconfig" ]; then
            cp arch/arm64/configs/vendor/lahaina-qgki-perf_defconfig out/.config
          elif [ -f "arch/arm64/configs/lahaina-perf_defconfig" ]; then
            cp arch/arm64/configs/lahaina-perf_defconfig out/.config
          elif [ -f "arch/arm64/configs/lahaina_defconfig" ]; then
            cp arch/arm64/configs/lahaina_defconfig out/.config
          fi
          
          # 3. حقن وتفعيل كود الـ KernelSU والـ Root بالملف المجهز مباشرة
          if [ -f "out/.config" ]; then
            sed -i '/CONFIG_KSU/d' out/.config
            echo "CONFIG_KSU=y" >> out/.config
            echo "====> Direct .config Injection Done Successfully <===="
          fi

      - name: Build Kernel (Direct Compilation Mode)
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # تحديث ملف الـ .config وتجهيزه للبناء الصارم بدون استدعاء defconfig خارجي
          make O=out olddefconfig ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-
          
          # انطلاق عملية الطبخ والترجمة الفعلية للكيرنال
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_with_KernelSU
          path: "**/out/arch/arm64/boot/Image"
