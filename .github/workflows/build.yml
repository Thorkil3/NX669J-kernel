name: Build KernelSU for Red Magic 6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Source Code Directly (Skip Git)
        run: |
          cd $GITHUB_WORKSPACE
          curl -L -o kernel.zip https://github.com/ztemt/NX669J-kernel/archive/refs/heads/main.zip
          unzip -q kernel.zip
          
          if [ -d "NX669J-kernel-main" ]; then
            mv NX669J-kernel-main/* . || true
            rm -rf NX669J-kernel-main
          fi
          rm -f kernel.zip

      - name: Setup Build Environment & Install LLVM Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lld llvm

      - name: Fetch Official Clang Toolchain via Git
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang-prebuilt
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang-prebuilt
          if [ -d "clang-r418222b" ]; then
            mv clang-r418222b/* $GITHUB_WORKSPACE/clang/
          elif [ -d "clang-stable" ]; then
            mv clang-stable/* $GITHUB_WORKSPACE/clang/
          fi
          rm -rf $GITHUB_WORKSPACE/clang-prebuilt

      - name: Integrate KernelSU Manually
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_DIR="."
          if [ -d "msm-5.4" ]; then TARGET_DIR="msm-5.4"; fi
          cd $TARGET_DIR
          
          mkdir -p drivers/kernelsu
          curl -L https://github.com/tiann/KernelSU/archive/refs/heads/main.zip -o ksu.zip
          unzip -q ksu.zip
          
          if [ -d "KernelSU-main" ]; then
            mv KernelSU-main/* drivers/kernelsu/ || true
            rm -rf KernelSU-main
          fi
          rm -f ksu.zip

          if [ -f "drivers/Makefile" ]; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Build Kernel (Generate Full Defconfig & Full LLVM)
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # إنشاء مجلد المخرجات مسبقاً وتوليد ملف الإعدادات المدمج الكامل للصين/العالمي (lahaina + vendor)
          mkdir -p out
          
          # استدعاء دمج ملف نوبيا الافتراضي مع معالج كوالكوم لإنشاء التكوين الصحيح
          if [ -f "arch/arm64/configs/vendor/lahaina-qgki-perf_defconfig" ]; then
            make O=out vendor/lahaina-qgki-perf_defconfig ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-
          elif [ -f "arch/arm64/configs/lahaina-perf_defconfig" ]; then
            make O=out lahaina-perf_defconfig ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-
          else
            make O=out lahaina_defconfig ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-
          fi
          
          # حقن وتفعيل كود KernelSU في ملف الـ .config المكتمل الناتج من الخطوة السابقة
          if [ -f "out/.config" ]; then
            sed -i '/CONFIG_KSU/d' out/.config
            echo "CONFIG_KSU=y" >> out/.config
          fi
          
          # بدء الطبخ الفعلي النهائي للكيرنال
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_with_KernelSU
          path: "**/out/arch/arm64/boot/Image"
