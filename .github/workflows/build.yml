name: Build KernelSU for Red Magic 6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Source Code Directly (Skip Git)
        run: |
          cd $GITHUB_WORKSPACE
          curl -L -o kernel.zip https://github.com/ztemt/NX669J-kernel/archive/refs/heads/main.zip
          unzip -q kernel.zip
          
          if [ -d "NX669J-kernel-main" ]; then
            mv NX669J-kernel-main/* . || true
            rm -rf NX669J-kernel-main
          fi
          rm -f kernel.zip

      - name: Setup Build Environment & Install LLVM Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lld llvm libssl-dev pkg-config libmpc-dev libmpfr-dev libgmp-dev

      - name: Fetch Official Clang Toolchain via Git
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang-prebuilt
          mkdir -p $GITHUB_WORKSPACE/clang
          if [ -d "$GITHUB_WORKSPACE/clang-prebuilt/clang-r418222b" ]; then
            mv $GITHUB_WORKSPACE/clang-prebuilt/clang-r418222b/* $GITHUB_WORKSPACE/clang/
          elif [ -d "$GITHUB_WORKSPACE/clang-prebuilt/clang-stable" ]; then
            mv $GITHUB_WORKSPACE/clang-prebuilt/clang-stable/* $GITHUB_WORKSPACE/clang/
          fi
          rm -rf $GITHUB_WORKSPACE/clang-prebuilt

      - name: Inject KernelSU via Fast Submodule Clone
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_DIR="."
          if [ -d "msm-5.4" ]; then TARGET_DIR="msm-5.4"; fi
          cd $TARGET_DIR
          
          rm -rf drivers/kernelsu
          git clone https://github.com/tiann/KernelSU.git drivers/kernelsu
          cd drivers/kernelsu
          git checkout v0.9.5
          cd ../..

          if [ -f "drivers/Makefile" ]; then
            sed -i '/kernelsu/d' drivers/Makefile
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Ultimate Hard Patching & Safe Environment Prep
        run: |
          cd $GITHUB_WORKSPACE
          
          mkdir -p $GITHUB_WORKSPACE/custom_bin
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/custom_bin/ld.lld
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/custom_bin/ld
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/custom_bin/aarch64-linux-gnu-ld
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/custom_bin/aarch64-linux-gnu-ld.lld
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/custom_bin/aarch64-linux-android-ld
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/clang/bin/ld.lld
          cp /usr/bin/ld.lld $GITHUB_WORKSPACE/clang/bin/ld

          if [ -d "msm-5.4" ]; then cd msm-5.4; fi

          # 1. ترويض مشكلة الـ Stack Pointer لـ Clang الحديث
          if [ -f "arch/arm64/include/asm/stack_pointer.h" ]; then
            sed -i 's/register unsigned long current_stack_pointer.*/#define current_stack_pointer 0UL/g' arch/arm64/include/asm/stack_pointer.h
          fi

          # 2. ترقيع وإلغاء تعليمة brk المسببة للمشكلة داخل kgdb.h
          if [ -f "arch/arm64/include/asm/kgdb.h" ]; then
            sed -i 's/asm ("brk %0".*)/\/* bypassed *\//g' arch/arm64/include/asm/kgdb.h
          fi

          # 3. إيقاف بناء الـ vDSO المتعارض مع Clang الحديث في الـ Makefile الرئيسي لـ arm64
          if [ -f "arch/arm64/Makefile" ]; then
            sed -i 's/vdso_prepare//g' arch/arm64/Makefile
            sed -i 's/vdso//g' arch/arm64/Makefile
          fi

          if [ -f "scripts/sign-file.c" ]; then
            echo 'int main(void) { return 0; }' > scripts/sign-file.c
          fi
          if [ -f "scripts/extract-cert.c" ]; then
            echo 'int main(void) { return 0; }' > scripts/extract-cert.c
          fi
          if [ -f "scripts/insert-sys-cert.c" ]; then
            echo 'int main(void) { return 0; }' > scripts/insert-sys-cert.c
          fi

          if [ -f "drivers/leds/nubia_led/aw8695/Kconfig" ]; then
            tr -cd '\11\12\15\40-\176' < drivers/leds/nubia_led/aw8695/Kconfig > drivers/leds/nubia_led/aw8695/Kconfig.clean
            mv drivers/leds/nubia_led/aw8695/Kconfig.clean drivers/leds/nubia_led/aw8695/Kconfig
          fi

          CONF_PATH=""
          if [ -f "arch/arm64/configs/vendor/lahaina-qgki-perf_defconfig" ]; then
            CONF_PATH="arch/arm64/configs/vendor/lahaina-qgki-perf_defconfig"
          elif [ -f "arch/arm64/configs/lahaina-perf_defconfig" ]; then
            CONF_PATH="arch/arm64/configs/lahaina-perf_defconfig"
          elif [ -f "arch/arm64/configs/lahaina_defconfig" ]; then
            CONF_PATH="arch/arm64/configs/lahaina_defconfig"
          fi

          if [ ! -z "$CONF_PATH" ]; then
            sed -i '/CONFIG_ARM64_LSE_ATOMICS/d' $CONF_PATH
            sed -i '/CONFIG_MODULE_SIG/d' $CONF_PATH
            sed -i '/CONFIG_KGDB/d' $CONF_PATH
            sed -i '/CONFIG_CRYPTO_DEV_QCOM_MSM_QCE/d' $CONF_PATH
            sed -i '/CONFIG_VDSO/d' $CONF_PATH
            
            echo "CONFIG_ARM64_LSE_ATOMICS=n" >> $CONF_PATH
            echo "CONFIG_MODULE_SIG=n" >> $CONF_PATH
            echo "CONFIG_KGDB=n" >> $CONF_PATH
            echo "CONFIG_CRYPTO_DEV_QCOM_MSM_QCE=n" >> $CONF_PATH
            echo "CONFIG_VDSO=n" >> $CONF_PATH
          fi

          mkdir -p out
          if [ ! -z "$CONF_PATH" ]; then
            cp $CONF_PATH out/.config
          fi

      - name: Force Apply Defconfig Modifications & Final Clear Build
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          
          export PATH=$GITHUB_WORKSPACE/custom_bin:$GITHUB_WORKSPACE/clang/bin:$PATH
          
          make O=out olddefconfig ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-
          
          sed -i '/CONFIG_KSU/d' out/.config
          sed -i '/CONFIG_ARM64_LSE_ATOMICS/d' out/.config
          sed -i '/CONFIG_MODULE_SIG/d' out/.config
          sed -i '/CONFIG_MODULE_SIG_ALL/d' out/.config
          sed -i '/CONFIG_MODULE_SIG_FORCE/d' out/.config
          sed -i '/CONFIG_SYSTEM_TRUSTED_KEYS/d' out/.config
          sed -i '/CONFIG_KGDB/d' out/.config
          sed -i '/CONFIG_CRYPTO_DEV_QCOM_MSM_QCE/d' out/.config
          sed -i '/CONFIG_VDSO/d' out/.config
          
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_ARM64_LSE_ATOMICS=n" >> out/.config
          echo "CONFIG_MODULE_SIG=n" >> out/.config
          echo "CONFIG_MODULE_SIG_ALL=n" >> out/.config
          echo "CONFIG_MODULE_SIG_FORCE=n" >> out/.config
          echo 'CONFIG_SYSTEM_TRUSTED_KEYS=""' >> out/.config
          echo "CONFIG_KGDB=n" >> out/.config
          echo "CONFIG_CRYPTO_DEV_QCOM_MSM_QCE=n" >> out/.config
          echo "CONFIG_VDSO=n" >> out/.config

          make O=out olddefconfig ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-
          
          # البناء بنمط النواة الواحدة والتقرير الشامل لضمان الثبات التام وتخطي الـ vDSO
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- -j1 V=1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_with_KernelSU
          path: "**/out/arch/arm64/boot/Image"
