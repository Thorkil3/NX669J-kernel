name: Build KernelSU for Red Magic 6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Source Code Directly (Skip Git)
        run: |
          cd $GITHUB_WORKSPACE
          curl -L -o kernel.zip https://github.com/ztemt/NX669J-kernel/archive/refs/heads/main.zip
          unzip -q kernel.zip
          
          if [ -d "NX669J-kernel-main" ]; then
            mv NX669J-kernel-main/* . || true
            rm -rf NX669J-kernel-main
          fi
          rm -f kernel.zip

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Fetch Clang and GCC Toolchains via Git
        run: |
          # 1. سحب مستودع المترجمات الرسمي (Clang)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang-prebuilt
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang-prebuilt
          if [ -d "clang-r418222b" ]; then
            mv clang-r418222b/* $GITHUB_WORKSPACE/clang/
          elif [ -d "clang-stable" ]; then
            mv clang-stable/* $GITHUB_WORKSPACE/clang/
          fi
          rm -rf $GITHUB_WORKSPACE/clang-prebuilt

          # 2. العودة للمجلد الرئيسي وسحب مستودع الـ GCC المساعد
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $GITHUB_WORKSPACE/gcc64

          # 3. الحل العبقري: حقن المسارات في نظام الـ GitHub Actions بالكامل لضمان رؤية ld.lld
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH

      - name: Force Linker Injection (System-Wide Symlinks)
        run: |
          CLANG_LLD="$GITHUB_WORKSPACE/clang/bin/ld.lld"
          
          if [ -f "$CLANG_LLD" ]; then
            # ربط الـ Linker في المجلدات الرئيسية بشكل صارم
            sudo ln -sf "$CLANG_LLD" /usr/bin/ld.lld
            sudo ln -sf "$CLANG_LLD" /usr/bin/aarch64-linux-android-ld
            sudo ln -sf "$CLANG_LLD" /usr/bin/aarch64-linux-gnu-ld
            
            ln -sf "$CLANG_LLD" $GITHUB_WORKSPACE/clang/bin/aarch64-linux-android-ld
            ln -sf "$CLANG_LLD" $GITHUB_WORKSPACE/clang/bin/aarch64-linux-gnu-ld
            
            ln -sf "$CLANG_LLD" $GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-ld
            ln -sf "$CLANG_LLD" $GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-gnu-ld
          fi

      - name: Integrate KernelSU Manually
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_DIR="."
          if [ -d "msm-5.4" ]; then TARGET_DIR="msm-5.4"; fi
          cd $TARGET_DIR
          
          mkdir -p drivers/kernelsu
          curl -L https://github.com/tiann/KernelSU/archive/refs/heads/main.zip -o ksu.zip
          unzip -q ksu.zip
          
          if [ -d "KernelSU-main" ]; then
            mv KernelSU-main/* drivers/kernelsu/ || true
            rm -rf KernelSU-main
          fi
          rm -f ksu.zip

          if [ -f "drivers/Makefile" ]; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          if [ -f "arch/arm64/configs/lahaina_defconfig" ]; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/lahaina_defconfig
          fi

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          
          # البناء مباشرة والبيئة الآن محقونة وجاهزة تلقائياً
          make O=out lahaina_defconfig ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_with_KernelSU
          path: "**/out/arch/arm64/boot/Image"
