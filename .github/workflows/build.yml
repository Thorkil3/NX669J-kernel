name: Build KernelSU for Red Magic 6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Source Code Directly (Skip Git)
        run: |
          cd $GITHUB_WORKSPACE
          curl -L -o kernel.zip https://github.com/ztemt/NX669J-kernel/archive/refs/heads/main.zip
          unzip -q kernel.zip
          
          if [ -d "NX669J-kernel-main" ]; then
            mv NX669J-kernel-main/* . || true
            rm -rf NX669J-kernel-main
          fi
          rm -f kernel.zip

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Setup Clang Compiler (Official Action)
        uses: egm16/setup-clang@v1
        with:
          version: '12' # النسخة المستقرة والمتوافقة جداً مع كيرنال أندرويد 11 لجهازك

      - name: Integrate KernelSU Manually
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_DIR="."
          if [ -d "msm-5.4" ]; then TARGET_DIR="msm-5.4"; fi
          cd $TARGET_DIR
          
          mkdir -p drivers/kernelsu
          curl -L https://github.com/tiann/KernelSU/archive/refs/heads/main.zip -o ksu.zip
          unzip -q ksu.zip
          
          if [ -d "KernelSU-main" ]; then
            mv KernelSU-main/* drivers/kernelsu/ || true
            rm -rf KernelSU-main
          fi
          rm -f ksu.zip

          if [ -f "drivers/Makefile" ]; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          if [ -f "arch/arm64/configs/lahaina_defconfig" ]; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/lahaina_defconfig
          fi

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "msm-5.4" ]; then cd msm-5.4; fi
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          make O=out lahaina_defconfig
          make -j$(nproc) O=out

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_with_KernelSU
          path: |
            out/arch/arm64/boot/Image
            msm-5.4/out/arch/arm64/boot/Image
